name: Build Windows installer

on:
  pull_request:
    branches: [main]
    paths:
      - 'electron/**'
      - 'native/windows-drive/**'
      - 'server/desktop/**'
      - 'src/components/WindowsDrivePreview.tsx'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version à compiler (ex. 1.0.19). Vide : dernière release publiée.'
        required: false
        default: ''
  push:
    branches: [claude/windows-offline-app-install-okof14]
    tags: ['v*']

jobs:
  build-electron-windows:
    name: Build Electron NSIS installer
    # Only trusted same-repository PRs can access the private package registry.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    # electron-builder publishes to GitHub Releases (electron-builder.yml's
    # `publish` block) using this job's own default GITHUB_TOKEN — the repo
    # is public, same-repo releases just need contents:write, no separate PAT.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Authenticate GitHub Packages
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.NPM_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # electron-builder takes the version from package.json, never from the
      # git tag: with package.json left at 1.0.3, the v1.0.4 and v1.0.5 tag
      # builds both produced "ArchiOffice Setup 1.0.3.exe" and tried to
      # publish onto the OLD v1.0.3 release, which electron-builder skips
      # ("existing release published more than 2 hours ago") — so the new
      # release stayed empty, latest.yml kept saying 1.0.3, and no install
      # ever updated. The tag is the release's identity, so it is what the
      # build must use; package.json is aligned to it here, on the runner
      # only (nothing is committed).
      #
      # A manual run or a branch push has no tag, and package.json is never
      # bumped in the repo (it said 1.0.5 while the releases were at 1.0.18),
      # so those builds produced "Setup 1.0.5.exe". They now take, in order:
      # the `version` input, else the latest published release. They still
      # never publish (--publish onTagOrDraft only publishes on a tag).
      - name: Align package.json version with the release tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            source="tag $GITHUB_REF_NAME"
          elif [ -n "${INPUT_VERSION:-}" ]; then
            version="${INPUT_VERSION#v}"
            source="input"
          else
            latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName || true)
            if [ -z "$latest" ]; then
              echo "::warning::No published release found, using package.json as the version base."
              latest="v$(node -p 'require("./package.json").version')"
            fi
            version="${latest#v}"
            source="latest release $latest"
          fi
          if [ "$GITHUB_EVENT_NAME" = 'pull_request' ]; then
            # A test installer must not impersonate an already released version.
            # Bump the stable patch before adding the unique preview suffix.
            if [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))-drive.${GITHUB_RUN_NUMBER}"
            else
              echo "::error::Cannot derive a preview version from $version"
              exit 1
            fi
          fi
          npm version --no-git-tag-version --allow-same-version "$version"
          echo "Building version $version (from $source)"

      - name: Configure CFAPI preview provider
        run: cmake -S native/windows-drive -B native/windows-drive/build -A x64

      - name: Compile CFAPI preview provider
        run: cmake --build native/windows-drive/build --config Release

      - name: Build SPA (offline desktop build)
        run: npm run build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:3130
          VITE_SUPABASE_ANON_KEY: local-anon-key
          VITE_OFFLINE_MODE: 'true'

      - name: Bundle server
        run: npm run build:server

      - name: Fetch PostgREST (Windows x86-64)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          mkdir -p vendor/postgrest

          release_json=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/PostgREST/postgrest/releases/latest)

          # Confirmed asset naming as of PostgREST v14.14: postgrest-vX.Y-windows-x86-64.zip
          # (verified from this workflow's own diagnostic output, not guessed).
          asset_url=$(echo "$release_json" | jq -r '[.assets[].browser_download_url
            | select(test("windows"; "i") and test("x86.?64"; "i") and (test("\\.zip$") or test("\\.tar\\.xz$")))][0] // empty')

          if [ -z "$asset_url" ]; then
            echo "::error::Could not find a Windows x86-64 PostgREST release asset. Raw API response below — inspect it, check https://github.com/PostgREST/postgrest/releases, and fix this step's jq filter."
            echo "$release_json"
            exit 1
          fi

          echo "Downloading $asset_url"
          curl -sSL -o postgrest_archive "$asset_url"
          case "$asset_url" in
            *.zip) unzip -o postgrest_archive -d vendor/postgrest ;;
            *.tar.xz) tar -xJf postgrest_archive -C vendor/postgrest ;;
          esac
          ls -laR vendor/postgrest

          # The archive may nest the binary in a subfolder — flatten it so
          # electron/pgBootstrap.cjs finds it at a fixed, known path.
          found=$(find vendor/postgrest -iname 'postgrest.exe' | head -1)
          if [ -z "$found" ]; then
            echo "::error::postgrest.exe not found anywhere inside the downloaded archive — inspect the listing above."
            exit 1
          fi
          if [ "$found" != "vendor/postgrest/postgrest.exe" ]; then
            mv "$found" vendor/postgrest/postgrest.exe
          fi
          echo "postgrest.exe ready at vendor/postgrest/postgrest.exe"

      - name: Fetch Microsoft Visual C++ Redistributable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor
          curl -sSL -o vendor/vc_redist.x64.exe https://aka.ms/vs/17/release/vc_redist.x64.exe
          ls -la vendor/vc_redist.x64.exe

      - name: Build NSIS installer
        # Only a version tag (v*) publishes a GitHub Release — electron-updater
        # (electron/main.cjs) checks that feed on every launch, so a branch
        # push or manual dispatch (dev/test builds) must never land there:
        # onTagOrDraft only publishes when the ref is a tag, else it's the
        # same "never" as before.
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = 'pull_request' ]; then
            npx electron-builder --win --x64 --publish never
          else
            npx electron-builder --win --x64 --publish onTagOrDraft
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Size report of the unpacked app, largest first, to see what actually
      # weighs on the user's disk before trimming anything else.
      - name: Report installed size breakdown
        shell: bash
        run: |
          du -sh release/win-unpacked || true
          # Separate du calls: one call with nested paths skips the children
          # of a directory it already counted, hiding what is inside resources/.
          du -sh release/win-unpacked/* 2>/dev/null | sort -h | tail -8 || true
          echo "--- resources/"
          du -sh release/win-unpacked/resources/* 2>/dev/null | sort -h | tail -12 || true
          echo "--- resources/node_modules"
          du -sh release/win-unpacked/resources/node_modules/* 2>/dev/null | sort -h | tail -8 || true
          du -sh release/win-unpacked/resources/node_modules/@embedded-postgres/*/native/* 2>/dev/null | sort -h | tail -10 || true

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: ArchiOffice-Windows-installer
          path: release/*.exe
