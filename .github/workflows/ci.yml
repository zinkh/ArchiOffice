name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    name: Type check & build
    runs-on: ubuntu-latest

    # Lets tests/applySchemaFreshInstall.test.ts replay the Electron client's
    # entire local-bootstrap SQL history against a real, freshly emptied
    # Postgres — the only way to catch a migration that references a table a
    # LATER migration drops, or a USING clause that only works against the
    # column's original type. Two such bugs shipped in a row, each only ever
    # surfacing on an actual user's first launch (FakeSupabaseAdmin has no
    # real Postgres to misbehave against). Gated on PGHOST in the test file
    # itself, so a contributor's plain `npm test` without Postgres skips it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Authenticate GitHub Packages
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.NPM_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # Fails the build on a new critical vulnerability so one doesn't reach
      # main unnoticed. Kept at "critical" rather than "high": as of this
      # writing there are 4 known high/moderate findings with no safe fix yet
      # (nodemailer, quill/react-quill — fix requires a breaking major bump —
      # and xlsx, which has none upstream at all) tracked via Dependabot
      # instead of blocking every PR on them. Revisit the threshold once
      # those are resolved or explicitly accepted in SECURITY.md.
      - name: Dependency vulnerability scan
        run: npm audit --audit-level=critical

      - name: Type check
        run: npm run lint

      - name: Test
        run: npm test
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder_anon_key

      # Only build-windows.yml exercised this before, and only on its own
      # tag/branch trigger — never on every push/PR to main. A server-side
      # bundling break (a bad esbuild --external, an import cycle tsc
      # --noEmit doesn't catch under a bundler) went uncaught here.
      - name: Build server bundle
        run: npm run build:server
